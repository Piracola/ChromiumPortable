name: Portable Browser Build

on:
  workflow_call:
    inputs:
      config:
        description: Browser config path in the caller repository.
        required: false
        type: string
        default: browser.json
      target:
        description: Target name from the browser config.
        required: true
        type: string
      artifact-name:
        description: Uploaded artifact name.
        required: false
        type: string
        default: Portable-Browser-Build
      artifact-retention-days:
        description: Artifact retention days.
        required: false
        type: number
        default: 15
      builder-repository:
        description: Repository that contains ChromiumPortable builder scripts.
        required: true
        type: string
      builder-ref:
        description: Release tag of the builder repository that holds the engine bundle.
        required: false
        type: string
        default: v2

jobs:
  # Upstream version discovery is a handful of HTTP calls and needs no Windows,
  # so it runs on a Linux runner and the Windows job only starts when there is
  # actually something to build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update_needed: ${{ steps.check.outputs.UPDATE_NEEDED }}
      create_new_release: ${{ steps.check.outputs.CREATE_NEW_RELEASE }}
      upstream_version: ${{ steps.check.outputs.UPSTREAM_VERSION }}
      env_json: ${{ steps.check.outputs.env_json }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Download engine bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.builder-ref }}" \
            --repo "${{ inputs.builder-repository }}" \
            --pattern 'portable-builder-linux-x64.zip*' \
            --dir _engine
          (cd _engine && sha256sum -c portable-builder-linux-x64.zip.sha256)
          unzip -q _engine/portable-builder-linux-x64.zip -d _engine
          chmod +x _engine/portable-builder-linux-x64/portable-builder

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: _engine/portable-builder-linux-x64/portable-builder --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . check

      - name: Summarize
        shell: bash
        run: |
          echo "UPDATE_NEEDED=${{ steps.check.outputs.UPDATE_NEEDED }}"
          echo "UPSTREAM_VERSION=${{ steps.check.outputs.UPSTREAM_VERSION }}"
          echo "CREATE_NEW_RELEASE=${{ steps.check.outputs.CREATE_NEW_RELEASE }}"
          echo "MINOR_UPDATE=${{ steps.check.outputs.MINOR_UPDATE }}"
          echo "RELEASE_ID=${{ steps.check.outputs.RELEASE_ID }}"
          echo "RELEASE_TAG=${{ steps.check.outputs.RELEASE_TAG }}"

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Download engine bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.builder-ref }}" --repo "${{ inputs.builder-repository }}" --pattern 'portable-builder-windows-x64.zip*' --dir _engine
          $zip = Get-ChildItem _engine/*.zip | Select-Object -First 1
          $expected = ((Get-Content "$($zip.FullName).sha256") -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "engine bundle sha256 mismatch" }
          Expand-Archive $zip.FullName -DestinationPath _engine -Force
          New-Item -ItemType Directory -Force -Path build/assets | Out-Null
          $exe = (Resolve-Path '_engine/portable-builder-windows-x64/portable-builder.exe').Path
          "CPB_ENGINE=$exe" >> $env:GITHUB_ENV
          Write-Host "CPB_ENGINE=$exe"

      - name: Restore check results
        shell: pwsh
        env:
          CHECK_ENV: ${{ needs.check.outputs.env_json }}
        run: |
          if (-not $env:CHECK_ENV) { throw "The check job produced no environment payload." }
          foreach ($property in ($env:CHECK_ENV | ConvertFrom-Json).PSObject.Properties) {
            "$($property.Name)=$($property.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "$($property.Name)=$($property.Value)"
          }

      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Build portable browser
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . build

      - name: Archive build
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . archive

      - name: Verify archive
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . verify

      - name: Render release metadata
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . render-release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build/assets/*.7z
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Update existing release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "${{ inputs.target }}" --workdir . update-release

      - name: Upload assets to existing release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: build/assets/*.7z
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create new release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: build/assets/*.7z
        env:
          GITHUB_TOKEN: ${{ github.token }}
