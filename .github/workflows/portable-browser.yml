# Multi-target reusable pipeline for a browser repository.
#
# Callers keep their own triggers (push / schedule / workflow_dispatch) and pass
# `targets` as a comma-separated list; every target in the list is checked,
# built, verified, rendered and published as one shared Release. Adding an
# architecture or a channel is a caller-side list edit, not a workflow rewrite.
#
# Smoke launches are decided per target by the engine: an arm64 payload on an
# x64 runner runs the PE checks and skips the launch, so callers never split
# `verify-targets` into an x64 step and a `--no-smoke` step again.
name: Portable Browser Build

on:
  workflow_call:
    inputs:
      config:
        description: Browser config path in the caller repository.
        required: false
        type: string
        default: browser.json
      targets:
        description: Comma-separated target names from that config.
        required: true
        type: string
      artifact-name:
        description: Uploaded artifact name.
        required: false
        type: string
        default: Portable-Browser-Build
      artifact-retention-days:
        description: Artifact retention days.
        required: false
        type: number
        default: 15
      builder-repository:
        description: Repository that publishes the engine bundle.
        required: true
        type: string
      builder-ref:
        description: Release tag of the builder repository that holds the engine bundle.
        required: false
        type: string
        default: v2
      pre-check-command:
        description: Optional shell command run in the check job after checkout.
        required: false
        type: string
        default: ""

jobs:
  # Upstream version discovery is a handful of HTTP calls and needs no Windows,
  # so it runs on a Linux runner and the Windows job only starts when there is
  # actually something to build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update_needed: ${{ steps.check.outputs.UPDATE_NEEDED }}
      env_json: ${{ steps.check.outputs.env_json }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Run caller pre-check
        if: inputs.pre-check-command != ''
        shell: bash
        run: ${{ inputs.pre-check-command }}

      - name: Download engine bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.builder-ref }}" \
            --repo "${{ inputs.builder-repository }}" \
            --pattern 'portable-builder-linux-x64.zip*' \
            --dir _engine
          (cd _engine && sha256sum -c portable-builder-linux-x64.zip.sha256)
          unzip -q _engine/portable-builder-linux-x64.zip -d _engine
          chmod +x _engine/portable-builder-linux-x64/portable-builder

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: _engine/portable-builder-linux-x64/portable-builder --config "${{ inputs.config }}" --workdir . check-targets "${{ inputs.targets }}"

      - name: Summarize
        shell: bash
        env:
          CHECK_ENV: ${{ steps.check.outputs.env_json }}
        run: |
          python3 -c "
          import json, os
          for key, value in sorted(json.loads(os.environ['CHECK_ENV'] or '{}').items()):
              print(f'{key}={value}')
          "

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    concurrency:
      group: portable-build-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TARGETS: ${{ inputs.targets }}
      BUILDER_REF: ${{ inputs.builder-ref }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Download engine bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:BUILDER_REF" --repo "${{ inputs.builder-repository }}" --pattern 'portable-builder-windows-x64.zip*' --dir _engine
          $zip = Get-ChildItem _engine/*.zip | Select-Object -First 1
          $expected = ((Get-Content "$($zip.FullName).sha256") -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "engine bundle sha256 mismatch" }
          Expand-Archive $zip.FullName -DestinationPath _engine -Force
          New-Item -ItemType Directory -Force -Path build/assets | Out-Null
          $exe = (Resolve-Path '_engine/portable-builder-windows-x64/portable-builder.exe').Path
          "CPB_ENGINE=$exe" >> $env:GITHUB_ENV
          Write-Host "CPB_ENGINE=$exe"

      - name: Restore check results
        shell: pwsh
        env:
          CHECK_ENV: ${{ needs.check.outputs.env_json }}
        run: |
          if (-not $env:CHECK_ENV) { throw "The check job produced no environment payload." }
          foreach ($property in ($env:CHECK_ENV | ConvertFrom-Json).PSObject.Properties) {
            "$($property.Name)=$($property.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "$($property.Name)=$($property.Value)"
          }

      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Build updated targets
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --workdir . build-targets "$env:TARGETS"
          if ($LASTEXITCODE -ne 0) { throw 'build-targets failed' }

      - name: Verify archives
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --target "$env:TARGETS" --workdir . verify-targets
          if ($LASTEXITCODE -ne 0) { throw 'archive verification failed' }

      - name: Render release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --workdir . render-release-targets "$env:TARGETS"
          if ($LASTEXITCODE -ne 0) { throw 'render-release-targets failed' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/assets/*.7z
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Update existing release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:CPB_ENGINE --config "${{ inputs.config }}" --workdir . update-release-targets "$env:TARGETS"
          if ($LASTEXITCODE -ne 0) { throw 'update-release-targets failed' }

      - name: Upload assets to existing release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: build/assets/*.7z
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create new release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && env.UPDATE_NEEDED == 'true' && env.CREATE_NEW_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: build/assets/*.7z
        env:
          GITHUB_TOKEN: ${{ github.token }}
