name: release-engine

on:
  push:
    tags: ["v2*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test before release
        run: cargo test --workspace --release

      - name: Build engine and GUI
        run: |
          cargo build --release -p portable-builder
          cargo build --release -p builder-app

      - name: Stage self-contained engine bundle
        shell: pwsh
        run: |
          $stage = "dist/portable-builder-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & ./scripts/stage-dist.ps1 -Stage $stage -Bin target/release
          # 压顶层目录本身（消费方按 _engine/portable-builder-windows-x64/portable-builder.exe 取），
          # 不能压 "$stage/*"——那会把内容摊平到 zip 根，Linux 侧同理见下
          Compress-Archive -Path "$stage" -DestinationPath dist/portable-builder-windows-x64.zip -Force

      - name: Stage GUI directory build
        shell: pwsh
        run: |
          $stage = "dist/ChromiumPortableBuilder-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & ./scripts/stage-dist.ps1 -Stage $stage -Bin target/release -Gui
          Compress-Archive -Path "$stage" -DestinationPath dist/ChromiumPortableBuilder-windows-x64.zip -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v7
        with:
          name: engine-windows
          path: dist/*windows-x64.zip*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build engine
        run: cargo build --release -p portable-builder

      - name: Stage engine bundle
        run: |
          stage=dist/portable-builder-linux-x64
          mkdir -p "$stage"
          cp target/release/portable-builder "$stage/"
          cp -r catalog "$stage/catalog"
          (cd dist && zip -qr portable-builder-linux-x64.zip portable-builder-linux-x64)
          (cd dist && sha256sum portable-builder-linux-x64.zip > portable-builder-linux-x64.zip.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: engine-linux
          path: dist/*linux-x64.zip*

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip*
          fail_on_unmatched_files: true
      # Children download this bundle by tag, so they can only be dispatched
      # after the assets are up: dispatching from update-chrome-plus.yml would
      # race the upload and hand them the previous bundle.
      - name: Dispatch child builds
        if: github.ref_name == 'v2'
        env:
          CHILD_REPO_TOKEN: ${{ secrets.CHILD_REPO_TOKEN }}
          BUILDER_REF: v2
        run: python3 scripts/dispatch_child_builds.py
