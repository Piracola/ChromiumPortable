name: Update chrome++

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-chrome-plus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A tag pushed with GITHUB_TOKEN never triggers another workflow, so the
          # re-point below would go unnoticed by release-engine.yml. Persisting
          # the cross-repo PAT as the git credential makes the push an event of
          # the PAT's owner. That PAT needs contents:write here and
          # actions:write on the three child repositories.
          token: ${{ secrets.CHILD_REPO_TOKEN }}

      - name: Ensure 7-Zip is available
        shell: bash
        run: |
          if command -v 7z >/dev/null 2>&1 || command -v 7zz >/dev/null 2>&1 || command -v 7za >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Update chrome++ files
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_chrome_plus.py

      - name: Commit chrome++ update
        id: commit
        if: steps.update.outputs.updated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setdll/version-x64.dll setdll/setdll-x64.exe \
                  setdll/version-arm64.dll setdll/setdll-arm64.exe \
                  setdll/README.md setdll/chrome++.ini setdll/version.txt
          git commit -m "chore: update chrome++ to ${{ steps.update.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push

      - name: Re-point the rolling v2 tag
        if: steps.update.outputs.rebuild_needed == 'true'
        run: |
          # Children consume setdll/ from the engine bundle, which only exists as
          # a Release asset, so the new chrome++ binaries reach them through a v2
          # re-cut. release-engine.yml dispatches the child builds once its
          # assets are up; no dispatch belongs here.
          git tag -f v2 "${{ steps.commit.outputs.sha }}"
          git push -f origin refs/tags/v2
