[package]
name = "portable-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ChromiumPortable build engine (Rust port of portable_builder/)"

[lib]
name = "portable_builder"
path = "src/lib.rs"

[[bin]]
name = "portable-builder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
hex = "0.4"
lzma-rs = "0.3"
pelite = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Python json.dumps keeps dict insertion order; selected.browser.json
# must be byte-identical to the Python script output (prepare-target contract).
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }
